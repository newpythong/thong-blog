<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mực</title>
<meta name="theme-color" content="#f7efdb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f7efdb'/%3E%3Cpath d='M6 76 L34 34 L50 58 L64 26 L94 76 Z' fill='%23b4441f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..600;1,6..72,200..500&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css?v=260912c">
</head>
<body>

<canvas class="petals" data-density="0.5" data-alpha="0.72" aria-hidden="true"></canvas>
<canvas class="ripples" aria-hidden="true"></canvas>

<div class="veil">
  <svg class="veil__mark" viewBox="0 0 120 60" aria-hidden="true">
    <path d="M2 56 L30 18 L46 40 L64 8 L86 38 L100 24 L118 56 Z"/>
  </svg>
  <div class="veil__bar"></div>
</div>
<div class="grain"></div>
<div class="prog"></div>

<nav class="nav">
  <a class="nav__logo" href="./">
    <svg class="mk" viewBox="0 0 40 22" aria-hidden="true"><path d="M1 20 L11 6 L17 14 L23 2 L31 13 L39 20 Z"/></svg>
    <b>Mực</b>
  </a>
  <div class="nav__links">
    <a href="./">Trang chủ</a>
    <a class="nav__cta" href="admin.html">Đăng nhập &amp; viết</a>
  </div>
</nav>

<article>
  <div class="wrap wrap--read art-hero">
    <div class="eyebrow" id="kicker">Đang mở cuộn giấy…</div>
    <h1 id="title">&nbsp;</h1>
    <div class="art-meta" id="meta"></div>
  </div>
  <div class="wrap wrap--read"><div class="stream" aria-hidden="true"></div></div>
  <div class="wrap wrap--read">
    <div class="prose" id="body"></div>
  </div>
</article>

<footer class="foot">
  <div class="wrap wrap--read">
    <h2 class="foot__big"><a href="./">← Trở về</a></h2>
    <div class="foot__row">
      <div>© 2026 Thông</div>
      <div id="next"></div>
    </div>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script>if(window.gsap&&window.ScrollTrigger)document.documentElement.classList.add('gsap');</script>
<script src="assets/js/core.js?v=260912c"></script>
<script src="assets/js/scene.js?v=260912c"></script>
<script src="assets/js/motion.js?v=260912c"></script>
<script>
(async () => {
  const S = window.SUMI;
  const slug = new URLSearchParams(location.search).get('p') || '';
  const $ = id => document.getElementById(id);

  if (!/^[a-z0-9-]{1,80}$/.test(slug)) {
    $('kicker').textContent = 'Lạc đường';
    $('title').textContent = 'Không tìm thấy bài này';
    $('body').innerHTML = '<p>Đường dẫn không hợp lệ. <a href="./">Về trang chủ</a>.</p>';
    return;
  }

  const posts = await S.loadIndex();
  const i = posts.findIndex(p => p.slug === slug);
  const meta = i >= 0 ? posts[i] : { slug, title: slug, date: '' };

  let raw;
  try { raw = await S.loadPost(slug); }
  catch (e) {
    $('kicker').textContent = 'Lạc đường';
    $('title').textContent = 'Bài viết đã tan như mực trong nước';
    $('body').innerHTML = '<p>Không tìm thấy nội dung. <a href="./">Về trang chủ</a>.</p>';
    return;
  }

  // strip an optional leading "# Title" so it is not printed twice
  const body = raw.replace(/^﻿/, '').replace(/^\s*#\s+.*\n+/, '');

  document.title = (meta.title || slug) + ' · Mực';
  $('kicker').textContent = meta.tag || 'Ghi chép';
  $('title').textContent = meta.title || slug;
  $('meta').innerHTML =
    (meta.date ? '<span>' + S.esc(S.fmtDate(meta.date)) + '</span>' : '') +
    '<span>' + S.readTime(body) + ' phút đọc</span>' +
    '<span>Thông</span>';
  $('body').innerHTML = S.md(body);
  const f = $('body').firstElementChild;
  if (f && f.tagName === 'P') f.classList.add('dropcap');

  if (window.__refreshMotion) window.__refreshMotion();

  const nx = posts[i + 1] || posts[0];
  if (nx && nx.slug !== slug) {
    $('next').innerHTML = 'Tiếp: <a class="lnk" href="post.html?p=' +
      encodeURIComponent(nx.slug) + '">' + S.esc(nx.title || nx.slug) + '</a>';
  }
})();
</script>
</body>
</html>
